name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # For dispatching prune-diff-rules after a publish (see the last step).
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # changesets/action pushes the release commit/tags using the git
      # credentials persisted by checkout, so persist-credentials must stay on
      # here (unlike every other workflow). Scoped exception, not a blanket one.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@c47fa68bd43bb8ae0bae7e558622593deebf5955 # v2.0.0-next.3
        with:
          version: npm run version-packages
          publish: bash scripts/release-publish.sh
          commit: "chore: release"
          title: "chore: release"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Optional public-read PAT, mirrored into each deployed Worker as a
          # secret so whole-repo discovery mode authenticates its GitHub
          # contents-API calls (60 → 5000 req/hour/IP). Unset → the path stays
          # anonymous. Consumed by release-publish.sh / manage-pinned-workers.mjs.
          GITHUB_PUBLIC_READ_TOKEN: ${{ secrets.GITHUB_PUBLIC_READ_TOKEN }}
          # Gates repo mode (fetching files from GitHub by owner/repo). Off
          # unless set truthy. Overlaid onto every Worker deploy via `--var`.
          REPO_MODE_ENABLED: ${{ vars.REPO_MODE_ENABLED }}
          # D1 database id for the archived-uses worklist, injected into the
          # deploy config by scripts/prepare-wrangler-d1.mjs. Unset → the
          # binding is dropped and the Worker no-ops its sweep (cf/index.js).
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          # Dark-launch tuning. Unset → Worker defaults apply (see cf/index.js
          # and cf/maintenance.js for the fallback values).
          CAPTURE_CONTENT_LIMIT_KIB: ${{ vars.CAPTURE_CONTENT_LIMIT_KIB }}
          CAPTURES_SIZE_LIMIT_MIB: ${{ vars.CAPTURES_SIZE_LIMIT_MIB }}
          CAPTURES_RECOVERY_RATIO: ${{ vars.CAPTURES_RECOVERY_RATIO }}
          # Top-N retention for `karinto-vX-Y-Z` pinned Workers. The
          # "latest patch per major" set is kept on top of this regardless.
          PINNED_KEEP_RECENT: ${{ vars.PINNED_KEEP_RECENT }}

      - name: Trigger release-published workflows
        # prune-diff-rules and rebaseline-captures declare
        # `on: release: published`, but the GitHub Release above is created by
        # changesets/action with GITHUB_TOKEN, and token-created events never
        # start other workflows — so those triggers can't fire from a real
        # release. Dispatch them explicitly instead (dispatching with
        # GITHUB_TOKEN is allowed; only event *creation* is suppressed).
        # Requires the workflow-level `actions: write`. Both are safe to
        # dispatch unconditionally: prune no-ops into "no removable rules",
        # and rebaseline's signal gate re-derives the release tag range
        # itself and no-ops without a removed diff-rule.
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run prune-diff-rules --repo "$REPO"
          gh workflow run rebaseline-captures --repo "$REPO"
