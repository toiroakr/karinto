name: lint

# Lint this repo's own GitHub Actions workflows with the same three upstream
# linters the project benchmarks against (actionlint / zizmor / ghalint). The
# binaries are pinned in mise.toml and installed via mise-action, mirroring
# upstream-parity.yml.
on:
  pull_request:
    paths:
      - .github/workflows/**
      - mise.toml
      - ghalint.yaml
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - mise.toml
      - ghalint.yaml

# Default to no privileges; the job opts into exactly what it needs.
permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install linters
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          # Invoke binaries explicitly via `mise exec` rather than activating
          # global shims, matching upstream-parity.yml.
          experimental: false

      - name: actionlint
        run: mise exec -- actionlint -color

      - name: ghalint
        run: mise exec -- ghalint run

      - name: zizmor
        env:
          # Enables zizmor's online audits (e.g. known-vulnerable-actions).
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- zizmor .github/workflows/
