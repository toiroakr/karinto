name: lint

# Static checks that need no build. Two groups:
#
#   * This repo's own GitHub Actions workflows, linted with the same three
#     upstream linters the project benchmarks against (actionlint / zizmor /
#     ghalint). The binaries are pinned in mise.toml and installed via
#     mise-action, mirroring upstream-parity.yml.
#   * The dark-launch ignore rules under scripts/diff-rules, checked with
#     `replay.mjs --check-rules` so a rule that fails to import, or that omits
#     the `prunable` declaration prune-diff-rules.yml gates on, is caught here
#     rather than at release time.
#   * The unit tests for the replay/rebaseline diff logic (`node --test`). The
#     rule contract is written against the diff shapes in scripts/lib, and both
#     replay.mjs and rebaseline-captures.mjs read them — a regression there
#     changes which rules are considered to match, which fails silently.
#   * package-lock.json staying in sync with package.json (`lockfile-drift`
#     job). `version-packages` (the changesets release script) regenerates the
#     lockfile itself, but a manual edit to package.json outside that script
#     can leave it stale with no other check catching it — `npm ci` accepts a
#     lockfile whose recorded top-level name/version disagrees with
#     package.json, it only enforces the dependency graph. This also covers
#     shell-ts-adapter/package.json: it's consumed by the root lockfile via a
#     `file:` dependency, so a version bump there (e.g. a Renovate PR) can
#     drift the root lockfile just like a direct edit to package.json.
#   * cf/package-lock.json staying in sync with cf/package.json
#     (`cf-lockfile-drift` job) — cf/ is a separate npm project (the Worker
#     deploy tooling) with its own lockfile, so it needs the same check
#     independently of the root one above.
#
# `lint` is a required status check, so the workflow must report a check run
# on every PR — a trigger-level `paths:` filter would leave non-matching PRs
# without a check run and permanently unmergeable. Instead the `changes` job
# detects relevant paths and `lint` skips (= passes the requirement) when
# nothing relevant changed. `lockfile-drift` is not a required check, so it
# uses the same `changes` job but its own path filter instead.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - mise.toml
      - ghalint.yaml
      - scripts/diff-rules/**
      - scripts/replay.mjs
      - scripts/rebaseline-captures.mjs
      # Glob, not the individual file: the diff/rule logic these checks cover
      # lives here and is imported by both scripts, so any module added later
      # must trigger them too. Naming files one by one is how a shared module
      # ends up silently unchecked.
      - scripts/lib/**
      - package.json
      - package-lock.json
      - shell-ts-adapter/package.json
      - cf/package.json
      - cf/package-lock.json

# Default to no privileges; each job opts into exactly what it needs.
permissions: {}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      lockfile: ${{ steps.filter.outputs.lockfile }}
      cfLockfile: ${{ steps.filter.outputs.cfLockfile }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - '.github/workflows/**'
              - 'mise.toml'
              - 'ghalint.yaml'
              - 'scripts/diff-rules/**'
              - 'scripts/replay.mjs'
              - 'scripts/rebaseline-captures.mjs'
              # Keep in step with the trigger `paths:` above — see the comment
              # there for why this is a glob.
              - 'scripts/lib/**'
            lockfile:
              - 'package.json'
              - 'package-lock.json'
              # shell-ts-adapter is pulled into the root lockfile via a
              # `file:` dependency — see the comment atop this workflow.
              - 'shell-ts-adapter/package.json'
            cfLockfile:
              - 'cf/package.json'
              - 'cf/package-lock.json'

  lint:
    needs: changes
    # `relevant != 'false'` (not `== 'true'`) so a failed `changes` job falls
    # back to running the lint rather than silently green-lighting the PR.
    # Non-pull_request events skip `changes`, hence the `!cancelled()`.
    if: >-
      ${{ !cancelled()
      && (github.event_name != 'pull_request'
          || needs.changes.outputs.relevant != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install linters
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: true
          # Invoke binaries explicitly via `mise exec` rather than activating
          # global shims, matching upstream-parity.yml.
          experimental: false

      - name: actionlint
        run: mise exec -- actionlint -color

      - name: ghalint
        run: mise exec -- ghalint run

      - name: zizmor
        env:
          # Enables zizmor's online audits (e.g. known-vulnerable-actions).
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- zizmor .github/workflows/

      # No `cache:` input, and this job builds and publishes nothing — it only
      # imports the rule modules — so there is no runtime cache surface to
      # poison.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '22'
          package-manager-cache: false

      # Fails when a rule module can't be imported or omits `prunable`, the
      # field prune-diff-rules.yml needs to tell a transient "shipped fix" rule
      # from a permanent one. Catching it here keeps the release-time pruner
      # from having to refuse to act on an incomplete report.
      - name: diff-rules
        run: node scripts/replay.mjs --check-rules

      # The diff shapes the rule contract is written against, plus the verdicts
      # rebaseline-captures.mjs derives from them. Both are decision logic whose
      # failure mode is silence — a rule that stops matching reads as "the fix
      # has not shipped" rather than as a bug — so they are covered by tests
      # rather than left to a real run to expose. Quoted glob so a test file
      # added later is picked up without editing this line.
      - name: diff-logic tests
        run: node --test "scripts/**/*.test.mjs"

  lockfile-drift:
    needs: changes
    if: >-
      ${{ !cancelled()
      && (github.event_name != 'pull_request'
          || needs.changes.outputs.lockfile != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No package manager cache: --package-lock-only never touches
      # node_modules, so there's no install to speed up, and any cache key
      # would be computed from the pre-regeneration lockfile — the file this
      # job exists to rewrite.
      # Node 24, not 22 like the other jobs: the lockfiles are written by
      # npm 11 (Renovate, local dev), and npm 10 (bundled with Node 22) drops
      # the `libc` field npm 11 records on platform-specific packages, which
      # would read as drift on every check.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      # --package-lock-only skips node_modules entirely, so this only ever
      # rewrites package-lock.json's own recorded fields (root name/version,
      # dependency graph) to match package.json — it can't be fooled by a
      # stale node_modules the way `npm ci` diffing afterwards could be.
      # --ignore-scripts: --package-lock-only alone does not skip lifecycle
      # scripts (preinstall/postinstall still run on npm 7+), which would let
      # a PR's own package.json execute arbitrary code during this check.
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Check package-lock.json is in sync with package.json
        run: |
          if ! git diff --exit-code package-lock.json; then
            echo "::error::package-lock.json is out of sync with package.json (see diff above). Run 'npm install --package-lock-only --ignore-scripts' and commit the result."
            exit 1
          fi

  # Mirrors lockfile-drift above, but for cf/ — a separate npm project (the
  # Worker deploy tooling) with its own package.json/package-lock.json, not
  # covered by the root check.
  cf-lockfile-drift:
    needs: changes
    if: >-
      ${{ !cancelled()
      && (github.event_name != 'pull_request'
          || needs.changes.outputs.cfLockfile != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 for npm 11 — see lockfile-drift above.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - working-directory: cf
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Check cf/package-lock.json is in sync with cf/package.json
        run: |
          if ! git diff --exit-code cf/package-lock.json; then
            echo "::error::cf/package-lock.json is out of sync with cf/package.json (see diff above). Run 'npm install --package-lock-only --ignore-scripts' in cf/ and commit the result."
            exit 1
          fi
