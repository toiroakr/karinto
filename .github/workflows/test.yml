name: test

on:
  pull_request:
    # `labeled`/`unlabeled` so `skip-changeset` re-evaluates without a dummy commit.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# Default to no privileges; each job opts into exactly what it needs.
permissions: {}

jobs:
  moon-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Resolve registry
        run: moon update

      - name: moon test
        run: moon test

      # js-only packages (worker, cmd/main) are skipped by the default
      # wasm-gc run above, so cover them explicitly.
      - name: moon test (js)
        run: moon test --target js

  changeset-check:
    # Skip on the auto-generated "Version Packages" PR from changesets/action,
    # which removes (rather than adds) .changeset/*.md files.
    if: >-
      github.event_name == 'pull_request'
      && !contains(github.event.pull_request.labels.*.name, 'skip-changeset')
      && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Verify a changeset is present
        env:
          # Pass the (attacker-influenceable) base ref through the environment
          # rather than interpolating it into the shell — avoids code injection.
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          ADDED=$(git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" \
            | grep -E '^\.changeset/[^/]+\.md$' \
            | grep -cvE '(^\.changeset/README\.md$|^\.changeset/config\.json$)') || true
          if [ "$ADDED" -eq 0 ]; then
            echo "::error::No changeset entry found. Run 'npx changeset' locally to add one, or apply the 'skip-changeset' label if the PR has no user-visible impact."
            exit 1
          fi
          echo "Found $ADDED new changeset file(s)."
