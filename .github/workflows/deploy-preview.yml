name: deploy-preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    # External fork PRs lack repo secrets; skip them — the comment step
    # would also fail without `pull-requests: write`.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      WORKER_NAME: karinto-pr-${{ github.event.pull_request.number }}
      WORKER_URL: https://karinto-pr-${{ github.event.pull_request.number }}.toiroakr.workers.dev
    steps:
      # Pin to the PR head SHA so the Worker we deploy and the replay
      # script / diff rules running against it stay in lockstep with
      # replay-on-label.yml (which also checks out head.sha).
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - run: moon update

      - name: Build JS bundle
        run: moon build --target js --release

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cf/package-lock.json

      - working-directory: cf
        run: npm ci

      - name: Deploy preview Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cf
          # `--env=""` targets the top-level env in wrangler.jsonc, which
          # deliberately omits the CAPTURES R2 binding so preview Workers
          # can't write to the captures bucket. Without this flag, wrangler 4
          # warns and the deploy is ambiguous.
          command: deploy --env="" --name ${{ env.WORKER_NAME }}

      - name: Smoke check
        working-directory: cf
        run: bash smoke.sh "$WORKER_URL"

      - name: Comment preview URL
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: preview-worker
          message: |
            Preview Worker deployed: ${{ env.WORKER_URL }}

            ```sh
            curl -X POST --data-binary @workflow.yml ${{ env.WORKER_URL }}
            ```

            Add the **`regression-test`** label to re-run the dark-launch
            replay against the latest commit.

            <sub>Auto-cleaned when this PR closes.</sub>

      # Auto-replay on the first deploy of the PR (opened/reopened). Later
      # commits don't re-run automatically — add the `regression-test`
      # label to trigger `replay-on-label.yml`.
      - name: Replay prod captures (first deploy)
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Write the summary inside GITHUB_WORKSPACE so `hashFiles()` can
          # see it (it only matches files in the checked-out workspace).
          REPLAY_SUMMARY_PATH: ${{ github.workspace }}/replay-summary.md
          REPLAY_LIMIT: ${{ vars.REPLAY_LIMIT || '200' }}
        run: |
          # All three are required by scripts/replay.mjs — fail fast and
          # skip the step cleanly if any is missing, instead of letting
          # node throw mid-flight.
          if [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ] || [ -z "${R2_ACCOUNT_ID:-}" ]; then
            echo "R2 credentials not fully set; skipping replay."
            exit 0
          fi
          node scripts/replay.mjs --target "$WORKER_URL" --limit "$REPLAY_LIMIT"

      - name: Comment replay summary
        if: ${{ always() && hashFiles('replay-summary.md') != '' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: dark-launch-replay
          path: ${{ github.workspace }}/replay-summary.md
