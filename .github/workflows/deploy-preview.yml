name: deploy-preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    # External fork PRs lack repo secrets; skip them — the comment step
    # would also fail without `pull-requests: write`.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      WORKER_NAME: karinto-pr-${{ github.event.pull_request.number }}
      WORKER_URL: https://karinto-pr-${{ github.event.pull_request.number }}.toiroakr.workers.dev
    steps:
      # Pin to the PR head SHA so the Worker we deploy and the replay
      # script / diff rules running against it stay in lockstep with
      # replay-on-label.yml (which also checks out head.sha).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - run: moon update

      - name: Build JS bundle
        run: moon build --target js --release

      # Preview deploys publish a namespaced, throwaway Worker (karinto-pr-<n>);
      # the npm cache is keyed on cf/package-lock.json and not consumed by any
      # release/prod job, so cache poisoning has no trusted blast radius.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cf/package-lock.json

      - working-directory: cf
        run: npm ci

      # Inject the D1 database_id into a throwaway wrangler.deploy.jsonc; the
      # tracked wrangler.jsonc keeps the placeholder. Unset var → no D1 binding.
      - name: Render deploy config
        working-directory: cf
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: node ../scripts/prepare-wrangler-d1.mjs

      - name: Deploy preview Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cf
          # `--env=""` targets the top-level env in the deploy config, which
          # deliberately omits the CAPTURES R2 binding so preview Workers
          # can't write to the captures bucket. Without this flag, wrangler 4
          # warns and the deploy is ambiguous.
          command: deploy --config wrangler.deploy.jsonc --env="" --name ${{ env.WORKER_NAME }}

      # Mirror the optional public-read PAT into the preview Worker so
      # whole-repo discovery authenticates its GitHub API calls (60 → 5000
      # req/hour/IP). No-op when the repo secret is unset. Only same-repo PRs
      # reach this job (see the job-level `if`), so the token isn't exposed to
      # forks.
      - name: Sync GitHub read token (if configured)
        working-directory: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_PUBLIC_READ_TOKEN: ${{ secrets.GITHUB_PUBLIC_READ_TOKEN }}
        run: |
          if [ -z "${GITHUB_PUBLIC_READ_TOKEN:-}" ]; then
            echo "GITHUB_PUBLIC_READ_TOKEN not set; whole-repo mode stays anonymous."
            exit 0
          fi
          printf '%s' "$GITHUB_PUBLIC_READ_TOKEN" \
            | npx wrangler secret put GITHUB_PUBLIC_READ_TOKEN \
                --config wrangler.deploy.jsonc --env="" --name "$WORKER_NAME"

      - name: Smoke check
        working-directory: cf
        run: bash smoke.sh "$WORKER_URL"

      - name: Comment preview URL
        uses: marocchino/sticky-pull-request-comment@d4d6b0936434b21bc8345ad45a440c5f7d2c40ff # v3.0.3
        with:
          header: preview-worker
          message: |
            Preview Worker deployed: ${{ env.WORKER_URL }}

            ```sh
            curl -X POST --data-binary @workflow.yml ${{ env.WORKER_URL }}
            ```

            Add the **`regression-test`** label to re-run the dark-launch
            replay against the latest commit.

            <sub>Auto-cleaned when this PR closes.</sub>

      # Auto-replay on the first deploy of the PR (opened/reopened). Later
      # commits don't re-run automatically — add the `regression-test`
      # label to trigger `replay-on-label.yml`.
      - name: Replay prod captures (first deploy)
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Write the summary inside GITHUB_WORKSPACE so `hashFiles()` can
          # see it (it only matches files in the checked-out workspace).
          REPLAY_SUMMARY_PATH: ${{ github.workspace }}/replay-summary.md
          REPLAY_LIMIT: ${{ vars.REPLAY_LIMIT || '200' }}
        run: |
          # All three are required by scripts/replay.mjs — fail fast and
          # skip the step cleanly if any is missing, instead of letting
          # node throw mid-flight.
          if [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ] || [ -z "${R2_ACCOUNT_ID:-}" ]; then
            echo "R2 credentials not fully set; skipping replay."
            exit 0
          fi
          node scripts/replay.mjs --target "$WORKER_URL" --limit "$REPLAY_LIMIT"

      - name: Comment replay summary
        if: ${{ always() && hashFiles('replay-summary.md') != '' }}
        uses: marocchino/sticky-pull-request-comment@d4d6b0936434b21bc8345ad45a440c5f7d2c40ff # v3.0.3
        with:
          header: dark-launch-replay
          path: ${{ github.workspace }}/replay-summary.md
