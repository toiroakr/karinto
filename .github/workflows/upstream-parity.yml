name: upstream-parity

# Runs karinto on the vendored upstream fixtures alongside the matching
# upstream linter and compares per-rule (zizmor / ghalint) or per-source
# aggregate (actionlint). See scripts/upstream-parity/compare.mjs for the
# diff classification. Tool versions and fixtures are kept in lockstep via
# mise.toml + the weekly upstream-refresh workflow.
#
# Trigger note: the weekly upstream-refresh PR is opened with GITHUB_TOKEN,
# and GitHub does not start `pull_request` workflows for token-created
# events. So that PR won't auto-run parity. Adding the `run-parity` label
# (maintainer only — see the job `if`) is the manual escape hatch; the label
# is removed after the run so re-adding it re-triggers.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - .github/workflows/upstream-parity.yml
      - mise.toml
      - rules.mbt
      - rules_catalog.mbt
      - karinto.mbt
      - worker/**
      - fixtures/upstream/**
      - scripts/upstream-parity/**
  push:
    branches: [main]
    paths:
      - .github/workflows/upstream-parity.yml
      - mise.toml
      - rules.mbt
      - rules_catalog.mbt
      - karinto.mbt
      - worker/**
      - fixtures/upstream/**
      - scripts/upstream-parity/**

jobs:
  parity:
    # Every event runs as before, except a `labeled` event runs only for the
    # `run-parity` trigger label added by the maintainer. This keeps the
    # manual escape hatch (for token-created refresh PRs) restricted while
    # leaving the normal opened/synchronize/push checks untouched.
    if: >-
      github.event.action != 'labeled'
      || (github.event.label.name == 'run-parity'
          && github.event.sender.login == 'toiroakr')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `gh pr edit --remove-label` (below) goes through the Issues API, so it
      # needs pull-requests + issues write on top of the read-only checkout.
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: Install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - run: moon update

      - name: Build JS bundle
        run: moon build --target js --release

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install upstream linters
        uses: jdx/mise-action@v2
        with:
          install: true
          # Don't activate the shims globally; we invoke binaries explicitly
          # via `mise exec` below to keep the rest of the job hermetic.
          experimental: false

      - name: Resolve linter binary paths
        id: bins
        run: |
          echo "actionlint=$(mise which actionlint)" >> "$GITHUB_OUTPUT"
          echo "zizmor=$(mise which zizmor)" >> "$GITHUB_OUTPUT"
          echo "ghalint=$(mise which ghalint)" >> "$GITHUB_OUTPUT"

      - name: Compare karinto vs upstream
        # `--soft` on main keeps the job green even on divergence (the report
        # still posts to the step summary). PRs hard-fail on divergence so
        # newly introduced regressions get caught at review time.
        run: |
          node scripts/upstream-parity/compare.mjs \
            --actionlint "${{ steps.bins.outputs.actionlint }}" \
            --zizmor     "${{ steps.bins.outputs.zizmor }}" \
            --ghalint    "${{ steps.bins.outputs.ghalint }}" \
            ${{ github.event_name == 'push' && '--soft' || '' }}

      - name: Remove trigger label
        # Drop the label even if the comparison failed, so re-adding it always
        # re-runs the check. Only relevant when the run was label-triggered.
        if: always() && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label run-parity
