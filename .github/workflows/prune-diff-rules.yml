name: prune-diff-rules

# After a release ships a behaviour change to prod, the `scripts/diff-rules/*.mjs`
# ignore rule that masked the resulting prod-vs-capture diff has done its job:
# prod now serves the new behaviour while the frozen captures still carry the
# old one, so the rule is actively suppressing a *real* diff. This job replays
# the stored captures against prod, detects which rules are in that "fix has
# shipped" state, and opens a PR removing exactly those.
#
# A rule is pruned only when ALL of these hold. Each gate exists because the
# obvious criterion on its own deletes something it shouldn't:
#
#   1. report.unexpected == 0 — no diff against prod that no rule explains.
#      Merging a pruning PR triggers a whole-bucket rebaseline, and
#      scripts/rebaseline-captures.mjs decides what to overwrite purely from the
#      prod-vs-capture response comparison — it never treats a diff as expected
#      just because some rule matches it. Pruning while unexplained drift exists
#      would therefore bake a prod regression into the baseline and destroy its
#      evidence, via a PR that claims to only delete dead rules. This gate fails
#      the job rather than opening such a PR.
#   2. matchCount > 0 — the rule explains a real prod-vs-capture diff. Counted
#      over ALL matching rules, not just the first one to match: rules are tried
#      in filename order, so first-match attribution lets an older broad rule
#      absorb a newer rule's captures and the newer rule looks unshipped forever.
#
#      This gate is also why this job cannot clean up after a rebaseline. A
#      rebaseline clears EVERY prod-vs-capture diff, so the other transient rules
#      stop matching and become invisible here — and matchCount == 0 cannot be
#      read as "dead", because it equally means "the fix has not shipped yet"
#      (prod and captures both still serve the old behaviour), where the rule is
#      about to become necessary. Nothing available at this point distinguishes
#      the two, so rebaseline-captures.mjs reports the rules it invalidates at
#      the moment it destroys their evidence; see its header and DEVELOPMENT.md
#      § "Collateral rules".
#   3. threwCount == 0 — the rule's `matches()` never errored. A rule that
#      throws suppresses nothing, so neither its count nor its silence says
#      anything about whether its fix shipped.
#   4. prunable == true — the rule declares itself transient. A *permanent* rule
#      (`prunable = false`, e.g. `2026-05-archived-uses-baseline.mjs`) masks
#      drift no release can ship — the `archived:list` KV set simply differs
#      between capture time and replay time — so it also reports matchCount > 0
#      and would be deleted as "shipped". That deletion is unrecoverable: a
#      rebaseline clears only the current drift, and the next refresh-archived
#      run reopens it with no rule left to suppress it. An undeclared `prunable`
#      is treated as unprunable and warned about (and lint.yml rejects it at
#      authoring time), so forgetting the field degrades to "needs manual
#      cleanup" rather than "CI is red forever".
#
# After the deletions are staged, `replay.mjs --check-rules` proves the
# remaining rules still import — the importer guard on the selection step is a
# grep heuristic, and a hole in it would otherwise ship a PR whose replay dies
# at rule-load time.
#
# Merging the PR this job opens is the human "bake this in" signal:
# rebaseline-captures.yml watches `main` for `scripts/diff-rules/**` deletions
# and rebaselines as soon as the merge lands, so the window where the rule is
# gone but the captures are still stale lasts one rebaseline run rather than
# until the next release. The removal PR is review-gated on purpose — a human
# decides when to bake each change in.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Prod URL to replay against"
        type: string
        default: "https://karinto.toiroakr.workers.dev"
      dry_run:
        description: "Detect and log removable rules without opening a PR"
        type: boolean
        default: false

concurrency:
  # Shared with rebaseline-captures.yml on purpose: this job READS the stored
  # captures to attribute per-rule matches, and rebaseline OVERWRITES them.
  # Overlapping runs would compute matchCount from a half-rewritten baseline, so
  # the two must never be in flight together. Serialising on one group also
  # keeps this job from racing itself, so two releases can't open competing PRs
  # on the same branch. Never cancel a run mid-flight.
  group: captures-baseline
  cancel-in-progress: false

# Default to no privileges; the job opts into exactly what it needs.
permissions: {}

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create-pull-request commits the rule deletions to a branch
      pull-requests: write # ...and opens the PR
    env:
      TARGET: ${{ github.event.inputs.target || 'https://karinto.toiroakr.workers.dev' }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `cache:` input, and this job builds/publishes nothing — it only runs
      # replay.mjs and opens a PR — so there is no runtime cache surface to poison.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '22'
          package-manager-cache: false

      # Replay the stored captures against prod. The per-rule report is written
      # to REPLAY_REPORT_PATH regardless of exit code (replay exits 1 when there
      # are unmatched/drift diffs); we only act on cleanly-matched rules, so
      # tolerate a non-zero exit here and let the next step read the report.
      - name: Replay prod captures
        id: replay
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPLAY_REPORT_PATH: ${{ github.workspace }}/replay-report.json
          REPLAY_LIMIT: ${{ vars.REPLAY_LIMIT || '200' }}
        run: |
          if [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ] || [ -z "${R2_ACCOUNT_ID:-}" ]; then
            echo "::error::R2 credentials not fully set (need R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID — the last is sourced from the CLOUDFLARE_ACCOUNT_ID secret). See DEVELOPMENT.md for setup."
            exit 1
          fi
          node scripts/replay.mjs --target "$TARGET" --limit "$REPLAY_LIMIT" || true
          if [ ! -f "$REPLAY_REPORT_PATH" ]; then
            echo "::error::replay produced no report at $REPLAY_REPORT_PATH (it likely failed before completing)."
            exit 1
          fi

      # Select the rules whose fix has shipped (matchCount > 0 AND
      # prunable == true — see the header comment for why matchCount alone is
      # unsound), git rm them, and build the PR body. Sets removed=<count> so the
      # PR step is skipped when nothing is removable.
      #
      # Guard: a candidate is skipped (not removed) if a rule file that is NOT
      # itself being removed still `import`s it — composite rules delegate to
      # other rule files (e.g. 2026-06-string-literal-with-promoted.mjs used to
      # import 2026-05-promote-zizmor-planned-rules.mjs), and deleting the
      # delegate out from under a surviving importer crashes replay.mjs's
      # `await import(...)` at rule-load time instead of just failing to match.
      - name: Select shipped rules
        id: select
        env:
          REPORT: ${{ github.workspace }}/replay-report.json
          BODY: ${{ github.workspace }}/pr-body.md
        run: |
          set -euo pipefail

          # Refuse to prune while the detection replay saw diffs no rule
          # explains. Merging a pruning PR triggers a WHOLE-BUCKET rebaseline,
          # and scripts/rebaseline-captures.mjs overwrites every capture whose
          # prod response differs — a rule matching a diff does not exempt it.
          # So an unexplained prod regression sitting in `unexpected` would be
          # baked into the baseline and its evidence destroyed, by a PR that
          # claims to be doing nothing but deleting dead rules. Unexplained
          # drift already fails `replay` on every PR, so the fix is to explain
          # or repair it first; use `dry_run: true` to inspect meanwhile.
          UNEXPECTED=$(jq '.unexpected' "$REPORT")
          if [ "$UNEXPECTED" -gt 0 ]; then
            echo "removed=0" >> "$GITHUB_OUTPUT"
            echo "::error::Detection replay saw $UNEXPECTED diff(s) against prod that no rule explains. Refusing to open a pruning PR: merging one rebaselines the whole capture bucket, which would bake that drift into the baseline. Investigate the unexpected diffs first (see the replay log), then re-run this workflow."
            exit 1
          fi

          # A rule whose `matches()` threw suppressed nothing on those captures,
          # so neither its match count nor its silence says anything about
          # whether its fix shipped. Never prune on that basis.
          jq -r '.rules[]
                 | select(.threwCount > 0)
                 | "::warning::scripts/diff-rules/\(.file) threw on \(.threwCount) capture(s); excluded from pruning until the rule is repaired."' \
            "$REPORT"

          # Surface every rule that matched but is held back by the prunable
          # gate. `prunable == false` is the intended steady state for permanent
          # rules; a null (undeclared) prunable is an authoring omission that
          # would otherwise silently opt the rule out of pruning forever.
          jq -r '.rules[]
                 | select(.matchCount > 0 and .threwCount == 0 and .prunable != true)
                 | "::warning::scripts/diff-rules/\(.file) explains \(.matchCount) prod diff(s) but was not pruned: \(if .prunable == false then "declared `prunable = false` (permanent rule — expected)" else "no `prunable` declaration; add one, see scripts/diff-rules/README.md" end)"' \
            "$REPORT"

          SELECT='.rules[] | select(.matchCount > 0 and .threwCount == 0 and .prunable == true)'
          CANDIDATE_COUNT=$(jq "[$SELECT] | length" "$REPORT")
          if [ "$CANDIDATE_COUNT" -eq 0 ]; then
            echo "removed=0" >> "$GITHUB_OUTPUT"
            echo "No prunable diff-rules are in the shipped state; nothing to prune."
            exit 0
          fi

          mapfile -t CANDIDATES < <(jq -r "$SELECT | .file" "$REPORT")

          is_in() {
            local name="$1"
            shift
            for x in "$@"; do
              [ "$name" = "$x" ] && return 0
            done
            return 1
          }

          imports() {
            # Does $1 (a scripts/diff-rules/*.mjs basename) import $2 (a basename)?
            local importer="scripts/diff-rules/$1"
            local target="$2"
            grep -qF "./${target}\"" "$importer" \
              || grep -qF "./${target}'" "$importer" \
              || grep -qF "./${target}\`" "$importer"
          }

          # SURVIVORS starts as every non-candidate file, then grows by fixed-point
          # closure: a candidate joins SURVIVORS as soon as *any* current survivor
          # imports it — including another candidate that already joined. Without
          # this closure, a candidate that is itself only kept alive by another
          # surviving candidate (not a non-candidate file) would be missed, and
          # removing it would break the surviving importer's import.
          SURVIVORS=()
          for other in scripts/diff-rules/*.mjs; do
            other_name=$(basename "$other")
            is_in "$other_name" "${CANDIDATES[@]}" || SURVIVORS+=("$other_name")
          done

          changed=true
          while $changed; do
            changed=false
            for f in "${CANDIDATES[@]}"; do
              is_in "$f" "${SURVIVORS[@]}" && continue
              for s in "${SURVIVORS[@]}"; do
                if imports "$s" "$f"; then
                  SURVIVORS+=("$f")
                  changed=true
                  break
                fi
              done
            done
          done

          TO_REMOVE=()
          SKIPPED=()
          for f in "${CANDIDATES[@]}"; do
            if is_in "$f" "${SURVIVORS[@]}"; then
              depended_on_by=""
              for s in "${SURVIVORS[@]}"; do
                [ "$s" = "$f" ] && continue
                if imports "$s" "$f"; then
                  depended_on_by="$s"
                  break
                fi
              done
              echo "::warning::scripts/diff-rules/$f is shipped but still imported by $depended_on_by; skipping removal until the importer is updated."
              SKIPPED+=("$f")
            else
              TO_REMOVE+=("$f")
            fi
          done

          echo "removed=${#TO_REMOVE[@]}" >> "$GITHUB_OUTPUT"
          if [ "${#TO_REMOVE[@]}" -eq 0 ]; then
            echo "All shipped rules are still imported by a surviving rule file; nothing removed."
            exit 0
          fi

          for f in "${TO_REMOVE[@]}"; do
            echo "removing scripts/diff-rules/$f"
            git rm --quiet "scripts/diff-rules/$f"
          done

          # Prove the post-deletion tree still loads before proposing it. The
          # importer guard above is a grep heuristic; a hole in it (an import
          # written in a form the greps miss) would otherwise ship a PR whose
          # replay dies inside `await import(...)` at rule-load time — failing
          # every PR for a reason that looks nothing like a pruning mistake.
          echo "verifying the remaining rules still load"
          node scripts/replay.mjs --check-rules

          TO_REMOVE_JSON=$(printf '%s\n' "${TO_REMOVE[@]}" | jq -R . | jq -s .)
          {
            echo "## Automated diff-rule pruning"
            echo
            echo "\`prune-diff-rules.yml\` replayed the stored prod captures against prod and"
            echo "found the rules below are in the \"fix has shipped\" state: prod now serves"
            echo "the new behaviour while the frozen captures still carry the old one, so each"
            echo "rule is actively suppressing a real prod-vs-capture diff. They have done their"
            echo "job and can be removed."
            echo
            echo "Removed:"
            jq -r --argjson removed "$TO_REMOVE_JSON" \
              '.rules[] | select(.file as $f | $removed | index($f)) | "- `scripts/diff-rules/\(.file)` (id `\(.id)`) — explains \(.matchCount) capture diff(s)"' \
              "$REPORT"
            if [ "${#SKIPPED[@]}" -gt 0 ]; then
              echo
              echo "Skipped (shipped, but still imported by another rule file — see the job log):"
              printf -- "- \`scripts/diff-rules/%s\`\n" "${SKIPPED[@]}"
            fi
            echo
            echo "Merging this PR triggers \`rebaseline-captures.yml\` — it watches \`main\` for"
            echo "\`scripts/diff-rules/**\` deletions — which overwrites the stored captures with"
            echo "the current prod responses and clears the diffs for good. Nothing else needs to"
            echo "happen; no release is required."
            echo
            echo "> The dark-launch \`replay\` check **on this PR** is *expected* to go red for the"
            echo "> captures listed above: the rule is gone but the captures still carry the"
            echo "> pre-fix findings it was suppressing. That red is the signal the rule was still"
            echo "> doing real work, not a regression. It clears for subsequent PRs as soon as the"
            echo "> post-merge rebaseline finishes."
            echo
            echo "The detection replay saw **no** unexplained diffs against prod; this workflow"
            echo "refuses to open a PR otherwise, because the post-merge rebaseline rewrites every"
            echo "differing capture and would bake unexplained drift into the baseline."
          } > "$BODY"

      - name: Open PR removing shipped rules
        if: ${{ steps.select.outputs.removed != '0' && env.DRY_RUN != 'true' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: scripts/diff-rules
          branch: chore/prune-diff-rules
          base: main
          title: 'chore: prune shipped diff-rules'
          commit-message: 'chore: prune shipped diff-rules'
          labels: skip-changeset
          body-path: ${{ github.workspace }}/pr-body.md
