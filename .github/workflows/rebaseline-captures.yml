name: rebaseline-captures

# Bake-in step of the dark-launch replay system. Captures are create-only and
# freeze the prod response of each first-seen request, which is what makes
# replay a stable regression baseline — but after a release ships an intended
# behaviour change, every frozen capture keeps the OLD response, so PR replays
# diff against already-shipped behaviour until the capture ages out (~30 days).
# The interim cost is a self-expiring `scripts/diff-rules/*.mjs` ignore rule.
#
# Re-baselining the whole bucket is exactly what replay exists to guard
# against, so it must only happen when a human has signalled that the shipped
# change is intentional. The signal is the DELETION of the matching
# expected-diff ignore rule (`scripts/diff-rules/*.mjs`): removing the opt-out
# is the explicit "bake this in" gesture. Absent that signal the job is a no-op,
# so an ordinary push never silently rewrites the baseline.
# `workflow_dispatch` with `force: true` bypasses the gate for manual recovery.
#
# The signal is read at MERGE time, from the pushed commit range on `main` —
# not from the next release's tag range. Once the deletion lands, `main` no
# longer carries the rule while the captures still carry the pre-fix responses,
# so every PR opened in between gets a red `replay` check for diffs that are
# already shipped. Keying off the merge collapses that window to a single
# rebaseline run; keying off the next release left it open for however long the
# next release happened to take (and pruning PRs are `skip-changeset`, so they
# do not produce one themselves). `workflow_dispatch` without `force` still
# falls back to the release-tag range as a manual net if a merge-time run was
# missed.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/diff-rules/**'
  workflow_dispatch:
    inputs:
      force:
        description: "Rebaseline even without a removed diff-rule signal"
        type: boolean
        default: false
      dry_run:
        description: "Report what would change without writing to R2"
        type: boolean
        default: false
      target:
        description: "Prod URL to replay against"
        type: string
        default: "https://karinto.toiroakr.workers.dev"

concurrency:
  # Serialise with itself: overlapping runs would race on R2 writes. Shared with
  # prune-diff-rules.yml, which READS the same captures to attribute per-rule
  # matches — a rebaseline landing mid-replay would have it compute matchCount
  # from a half-rewritten baseline. Never cancel a run mid-flight — a
  # half-written rebaseline is worse than a delay.
  group: captures-baseline
  cancel-in-progress: false

# Default to no privileges; the job opts into exactly what it needs.
permissions: {}

jobs:
  rebaseline:
    runs-on: ubuntu-latest
    # A signal run rewrites the WHOLE bucket sequentially; a timeout mid-flight
    # leaves the baseline partially rewritten (the very thing this workflow
    # exists to avoid). 60 min is a deliberate explicit budget: comfortably
    # above a realistic full-bucket pass, while still failing fast instead of
    # hanging up to GitHub's 6h default if prod or R2 stalls.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TARGET: ${{ github.event.inputs.target || 'https://karinto.toiroakr.workers.dev' }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
    steps:
      # fetch-depth: 0 brings full history and every tag so the signal step can
      # diff across the pushed range (even a force-pushed one) or the release
      # range. persist-credentials: false — the job only reads the repo and talks
      # to prod / R2 over their own credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Signal gate: a `scripts/diff-rules/*.mjs` file was REMOVED. On `push` the
      # range is the pushed commits — i.e. the merge that landed the pruning PR,
      # which is the earliest moment the signal exists. On `workflow_dispatch`
      # it falls back to the previous-tag..latest-tag range, a manual net for a
      # merge-time run that was missed. Either way the deletion is the human
      # "bake this in" signal; force=true skips the gate entirely.
      - name: Detect rebaseline signal
        id: signal
        env:
          # Pass GitHub-context values through env (never interpolate them into
          # the shell directly) to avoid script injection — see the workflow
          # injection guidance. `before` is GitHub's own SHA and force / tag_name
          # come from dispatchers with write access, but defence in depth is
          # cheap.
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${FORCE:-}" = "true" ]; then
            echo "Manual force dispatch — bypassing the diff-rule signal gate."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${EVENT_NAME:-}" = "push" ]; then
            # `before` is the branch tip prior to the push, so `before`..`sha`
            # covers exactly the pushed commits. Comparing the two trees (git
            # diff, not git log) also stays correct across a force-push, where
            # the question is still "does the branch no longer have the rule".
            #
            # There is deliberately no guessed fallback. `${GITHUB_SHA}^` would
            # narrow the range to the tip commit alone, so a deletion in an
            # earlier commit of the same push would silently produce "no
            # signal" and skip the rebaseline — the exact stale-capture window
            # this trigger exists to close. `before` is unusable only when the
            # branch was just created (all-zeros) or its old objects are gone,
            # both abnormal on `main`; fail loudly and let an operator use the
            # documented `workflow_dispatch` + `force: true` recovery path.
            FROM="${PUSH_BEFORE:-}"
            if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${FROM}^{commit}" 2>/dev/null; then
              if git rev-parse --verify --quiet "${GITHUB_SHA}^{commit}" >/dev/null \
                 && ! git rev-parse --verify --quiet "${GITHUB_SHA}^" >/dev/null; then
                # Root commit: it has no parent, so it provably deleted nothing.
                echo "$GITHUB_SHA is a root commit; nothing can have been removed."
                echo "run=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::cannot determine the pushed range: event.before (${FROM:-<empty>}) is absent or unreachable, and narrowing to the tip commit would miss a deletion made earlier in the same push. If a bake-in was intended, dispatch rebaseline-captures manually with force=true."
              exit 1
            fi
            TO="$GITHUB_SHA"
          else
            CURRENT_TAG="${RELEASE_TAG:-}"
            if [ -z "$CURRENT_TAG" ]; then
              CURRENT_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
            fi
            # Previous canonical (dotted) tag; dashed pointer tags (v0-8-4) are
            # excluded by the glob so they don't break the ordering.
            PREV_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V \
              | awk -v cur="$CURRENT_TAG" '$0==cur{print prev; exit} {prev=$0}')
            echo "current tag: ${CURRENT_TAG:-<none>}"
            echo "previous tag: ${PREV_TAG:-<none>}"

            if [ -z "$PREV_TAG" ] || [ -z "$CURRENT_TAG" ]; then
              echo "No tag range to diff; nothing to bake in."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            FROM="$PREV_TAG"
            TO="$CURRENT_TAG"
          fi

          # Keep the diff and the match separate: `git diff ... | grep || true`
          # collapses "the range is broken" and "nothing was removed" into the
          # same silent no-op, which would skip a requested rebaseline without a
          # trace. Fail loudly on the former; `|| true` covers only grep's
          # no-match exit.
          if ! DIFFED=$(git diff --diff-filter=D --name-only "$FROM" "$TO" -- scripts/diff-rules/); then
            echo "::error::git diff ${FROM}..${TO} failed; cannot determine the rebaseline signal."
            exit 1
          fi
          REMOVED=$(printf '%s\n' "$DIFFED" | grep -E '\.mjs$' || true)
          if [ -n "$REMOVED" ]; then
            echo "Removed diff-rule(s) in ${FROM}..${TO}:"
            echo "$REMOVED"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No diff-rule removed in ${FROM}..${TO}; skipping rebaseline."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # No `cache:` input, so setup-node restores and writes no cache; the job
      # builds nothing and only runs a node script against prod / R2. There is
      # no runtime-artifact cache surface for a privileged-trigger run to
      # poison, so zizmor's default setup-node caching heuristic is a non-issue.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning]
        if: steps.signal.outputs.run == 'true'
        with:
          node-version: '22'

      - name: Rebaseline captures
        if: steps.signal.outputs.run == 'true'
        env:
          # Both candidate credential pairs are passed in; the pair is chosen in
          # the shell below (an `||` per variable could mix a write key id with a
          # legacy secret, which fails later as an opaque signature error).
          #
          # The write-capable token is separate from the read-only R2_* one on
          # purpose: PR-triggered replay workflows run untrusted code and must
          # not carry write credentials to the captures bucket. Only this
          # workflow — which runs on main after a human merges a diff-rule
          # deletion — gets the write pair.
          WRITE_ACCESS_KEY_ID: ${{ secrets.R2_WRITE_ACCESS_KEY_ID }}
          WRITE_SECRET_ACCESS_KEY: ${{ secrets.R2_WRITE_SECRET_ACCESS_KEY }}
          LEGACY_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          LEGACY_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          # Select the key id and secret as an atomic pair. A half-configured
          # R2_WRITE_* pair (one secret set, the other not) is an operator
          # mistake, not a reason to silently splice in the legacy secret — that
          # would surface as a signature mismatch with no hint at the cause.
          if [ -n "${WRITE_ACCESS_KEY_ID:-}" ] && [ -n "${WRITE_SECRET_ACCESS_KEY:-}" ]; then
            export R2_ACCESS_KEY_ID="$WRITE_ACCESS_KEY_ID"
            export R2_SECRET_ACCESS_KEY="$WRITE_SECRET_ACCESS_KEY"
          elif [ -n "${WRITE_ACCESS_KEY_ID:-}" ] || [ -n "${WRITE_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::R2_WRITE_ACCESS_KEY_ID and R2_WRITE_SECRET_ACCESS_KEY must both be set (only one is). Refusing to fall back to a mismatched credential pair."
            exit 1
          else
            # Legacy fallback. The old R2_* token is read-only, so the script's
            # write preflight will fail fast with an actionable message.
            export R2_ACCESS_KEY_ID="${LEGACY_ACCESS_KEY_ID:-}"
            export R2_SECRET_ACCESS_KEY="${LEGACY_SECRET_ACCESS_KEY:-}"
          fi

          # All three R2 credentials are required by the script — fail the run
          # loudly if any is missing rather than silently skipping the bake-in.
          if [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ] || [ -z "${R2_ACCOUNT_ID:-}" ]; then
            echo "R2 credentials not fully set; need R2_WRITE_ACCESS_KEY_ID + R2_WRITE_SECRET_ACCESS_KEY (or legacy R2_ACCESS_KEY_ID + R2_SECRET_ACCESS_KEY) and CLOUDFLARE_ACCOUNT_ID." >&2
            exit 1
          fi
          DRY_FLAG=""
          if [ "${DRY_RUN:-}" = "true" ]; then DRY_FLAG="--dry-run"; fi
          node scripts/rebaseline-captures.mjs --target "$TARGET" $DRY_FLAG
