name: deploy-staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - run: moon update

      - run: moon test

      - name: Build JS bundle
        run: moon build --target js --release

      # Staging deploys only run on push to main (a trusted ref); the npm cache
      # is keyed on cf/package-lock.json and isn't consumed by release/prod, so
      # cache poisoning has no trusted blast radius.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cf/package-lock.json

      - name: Install cf deps
        working-directory: cf
        run: npm ci

      # Inject the D1 database_id into a throwaway wrangler.deploy.jsonc; the
      # tracked wrangler.jsonc keeps the placeholder. Unset var → no D1 binding.
      - name: Render deploy config
        working-directory: cf
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: node ../scripts/prepare-wrangler-d1.mjs

      - name: Deploy staging Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cf
          # `--var REPO_MODE_ENABLED:...` gates the GitHub-fetching repo-mode
          # endpoints (off unless the repo variable is set truthy).
          command: deploy --config wrangler.deploy.jsonc --env staging --var REPO_MODE_ENABLED:${{ vars.REPO_MODE_ENABLED || 'false' }}

      # Mirror the optional public-read PAT into the staging Worker so
      # whole-repo discovery authenticates its GitHub API calls (60 → 5000
      # req/hour/IP). No-op when the repo secret is unset.
      - name: Sync GitHub read token (if configured)
        working-directory: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_PUBLIC_READ_TOKEN: ${{ secrets.GITHUB_PUBLIC_READ_TOKEN }}
        run: |
          if [ -z "${GITHUB_PUBLIC_READ_TOKEN:-}" ]; then
            echo "GITHUB_PUBLIC_READ_TOKEN not set; whole-repo mode stays anonymous."
            exit 0
          fi
          printf '%s' "$GITHUB_PUBLIC_READ_TOKEN" \
            | npx wrangler secret put GITHUB_PUBLIC_READ_TOKEN \
                --config wrangler.deploy.jsonc --env staging

      - name: Smoke check
        working-directory: cf
        run: bash smoke.sh https://karinto-staging.toiroakr.workers.dev
