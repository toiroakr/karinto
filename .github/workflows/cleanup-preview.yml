name: cleanup-preview

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    env:
      WORKER_NAME: karinto-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cf/package-lock.json

      - working-directory: cf
        run: npm ci

      - name: Delete preview Worker
        id: delete
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: cf
        # The auto-generated changeset-release/main PR is created via
        # GITHUB_TOKEN, which never triggers workflows — so no preview Worker
        # was ever deployed for it. Treat "Worker does not exist" (code 10007)
        # as a no-op rather than a job failure.
        run: |
          if out=$(npx wrangler delete --name "$WORKER_NAME" 2>&1); then
            printf '%s\n' "$out"
            echo "deleted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -q 'code: 10007'; then
            echo "Worker $WORKER_NAME does not exist; nothing to clean up."
            echo "deleted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit 1

      - name: Mark preview comment as cleaned up
        if: steps.delete.outputs.deleted == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview-worker
          message: |
            Preview Worker `${{ env.WORKER_NAME }}` has been deleted.
