name: cleanup-preview

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      WORKER_NAME: karinto-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cf/package-lock.json

      - working-directory: cf
        run: npm ci

      - name: Delete preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: cf
        run: npx wrangler delete --name "$WORKER_NAME"

      - name: Mark preview comment as cleaned up
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-worker
          message: |
            Preview Worker `${{ env.WORKER_NAME }}` has been deleted.
