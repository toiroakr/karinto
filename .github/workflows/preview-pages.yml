name: preview-pages

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Narrowly scoped to the playground asset. Other docs/ files (e.g.
    # `pinning.md`) render natively on GitHub and don't need an artifact
    # preview.
    paths:
      - 'docs/index.html'
      - '.github/workflows/preview-pages.yml'

concurrency:
  group: preview-pages-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # `archive: false` (upload-artifact v7+, Feb 2026) keeps the file
      # unzipped so the GitHub UI serves it with its native content-type
      # and the artifact opens directly as the rendered playground. The
      # flag only supports a single-file upload, so this path is pinned to
      # the playground asset (the rest of `docs/` is plain markdown that
      # renders natively on GitHub).
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-preview-pr-${{ github.event.pull_request.number }}
          path: docs/index.html
          archive: false
          retention-days: 14

      # PR comment requires write permission on the auto-token, which fork
      # PRs don't get. The artifact itself still uploads for forks and is
      # accessible via the run's "Artifacts" panel.
      - name: Comment preview link
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: docs-preview
          message: |
            📄 **Docs preview** for `${{ github.event.pull_request.head.sha }}`:
            ${{ steps.upload.outputs.artifact-url }}

            Open the artifact and click `index.html` to view the playground
            in your browser. Retained 14 days.
