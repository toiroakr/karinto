name: upstream-refresh

# Weekly check (Monday 00:00 UTC) for new actionlint / zizmor / ghalint
# releases. When found, bumps mise.toml and re-vendors fixtures from the
# matching tag, then opens a PR. The PR auto-triggers upstream-parity.yml
# so a real behavioural diff fails before the bump can merge.
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Refresh fixtures
        id: refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/upstream-parity/refresh.mjs > refresh-summary.json
          changed=$(node -e "console.log(JSON.parse(require('fs').readFileSync('refresh-summary.json','utf8')).changed)")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Build PR body
        if: steps.refresh.outputs.changed == 'true'
        id: body
        run: |
          {
            echo 'Refresh upstream linter pins (auto-generated).'
            echo
            echo '| tool | from | to | release | compare |'
            echo '| --- | --- | --- | --- | --- |'
            node -e '
              const s = JSON.parse(require("fs").readFileSync("refresh-summary.json","utf8"));
              for (const u of s.updates) {
                const cmp = u.compareUrl ? `[\`v${u.from}...${u.tag}\`](${u.compareUrl})` : "—";
                console.log(`| ${u.name} | ${u.from} | ${u.to} | [${u.tag}](${u.url}) | ${cmp} |`);
              }
            '
            echo
            echo 'Fixtures under `fixtures/upstream/<tool>/` were re-vendored from the new tag. The `upstream-parity` workflow runs on this PR — its step summary lists any divergences (`unmapped` / soft) that point at newly-added upstream checks.'
            echo
            echo '## Upstream release notes'
            node -e '
              const s = JSON.parse(require("fs").readFileSync("refresh-summary.json","utf8"));
              for (const u of s.updates) {
                console.log(`\n<details><summary><b>${u.name}</b> ${u.tag}</summary>\n`);
                console.log(u.notes && u.notes.length ? u.notes : "_(no release notes published)_");
                console.log("\n</details>");
              }
            '
            echo
            echo '## Incorporation checklist'
            echo
            echo 'If the parity step summary surfaces an `unmapped` / soft divergence (an upstream check karinto does not yet cover), drive it through the **`upstream-rule-sync`** skill:'
            echo
            echo '- [ ] Reviewed the `compare` diff + release notes above for new / changed checks.'
            echo '- [ ] Checked the `upstream-parity` step summary for `unmapped` rule IDs / Kinds.'
            echo '- [ ] For each new check: registered it in `rules_catalog.mbt` (+ mirrored `rules_catalog.md`) with a status, or recorded the intentional divergence in `scripts/upstream-parity/allowlist.json`.'
            echo '- [ ] `moon test` + local parity pass.'
          } > pr-body.md
          # peter-evans/create-pull-request reads `body` as a literal string, so
          # pass via env to avoid quoting headaches.
          {
            echo 'PR_BODY<<EOF'
            cat pr-body.md
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Compose PR title
        if: steps.refresh.outputs.changed == 'true'
        id: title
        run: |
          summary=$(node -e '
            const s = JSON.parse(require("fs").readFileSync("refresh-summary.json","utf8"));
            console.log(s.updates.map(u => `${u.name} ${u.to}`).join(", "));
          ')
          echo "title=chore(upstream): refresh ${summary}" >> "$GITHUB_OUTPUT"

      - name: Open / update PR
        if: steps.refresh.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ steps.title.outputs.title }}
          title: ${{ steps.title.outputs.title }}
          body: ${{ env.PR_BODY }}
          branch: chore/upstream-refresh
          delete-branch: true
          labels: |
            dependencies
            skip-changeset
          # Don't enable auto-merge — a refresh PR may surface real parity
          # breaks that require human review.
