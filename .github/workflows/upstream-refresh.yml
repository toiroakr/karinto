name: upstream-refresh

# Weekly check (Monday 00:00 UTC) for new actionlint / zizmor / ghalint
# releases. When found, bumps mise.toml and re-vendors fixtures from the
# matching tag, then opens a PR. The PR is opened with GITHUB_TOKEN, so it
# does NOT auto-trigger upstream-parity.yml (GitHub suppresses workflows for
# token-created events); add the `run-parity` label to run the behavioural
# diff before merging the bump.
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Refresh fixtures
        id: refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/upstream-parity/refresh.mjs > refresh-summary.json
          changed=$(node -e "console.log(JSON.parse(require('fs').readFileSync('refresh-summary.json','utf8')).changed)")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Build PR body
        if: steps.refresh.outputs.changed == 'true'
        id: body
        run: |
          # shellcheck disable=SC2016  # `${...}` below are JS template literals, not shell.
          {
            echo 'Refresh upstream linter pins (auto-generated).'
            echo
            echo '| tool | from | to | release | compare |'
            echo '| --- | --- | --- | --- | --- |'
            node -e '
              const s = JSON.parse(require("fs").readFileSync("refresh-summary.json","utf8"));
              for (const u of s.updates) {
                const cmp = u.compareUrl ? `[\`v${u.from}...${u.tag}\`](${u.compareUrl})` : "—";
                console.log(`| ${u.name} | ${u.from} | ${u.to} | [${u.tag}](${u.url}) | ${cmp} |`);
              }
            '
            echo
            echo 'Fixtures under `fixtures/upstream/<tool>/` were re-vendored from the new tag. This PR is opened with `GITHUB_TOKEN`, so `upstream-parity` does **not** run automatically — add the `run-parity` label to trigger it. Its step summary then lists any divergences (`unmapped` / soft) that point at newly-added upstream checks.'
            echo
            echo '## Upstream release notes'
            node -e '
              const s = JSON.parse(require("fs").readFileSync("refresh-summary.json","utf8"));
              for (const u of s.updates) {
                console.log(`\n<details><summary><b>${u.name}</b> ${u.tag}</summary>\n`);
                console.log(u.notes && u.notes.length ? u.notes : "_(no release notes published)_");
                console.log("\n</details>");
              }
            '
            echo
            echo '## Incorporation checklist'
            echo
            echo 'If the parity step summary surfaces an `unmapped` / soft divergence (an upstream check karinto does not yet cover), follow the incorporation flow in [`DEVELOPMENT.md`](${{ github.server_url }}/${{ github.repository }}/blob/main/DEVELOPMENT.md#incorporating-a-new-upstream-check):'
            echo
            echo '- [ ] Reviewed the `compare` diff + release notes above for new / changed checks.'
            echo '- [ ] Added the `run-parity` label and checked the `upstream-parity` step summary for `unmapped` rule IDs / Kinds.'
            echo '- [ ] For each new check: registered it in `rules_catalog.mbt` (+ mirrored `rules_catalog.md`) with a status, or recorded the intentional divergence in `scripts/upstream-parity/allowlist.json`.'
            echo '- [ ] `moon test` + local parity pass.'
          } > pr-body.md
          # Pass the body to create-pull-request via `body-path` (below) rather
          # than round-tripping through $GITHUB_ENV: upstream release notes are
          # arbitrary text, and a line that is exactly `EOF` would terminate a
          # heredoc-delimited env write early.

      - name: Compose PR title
        if: steps.refresh.outputs.changed == 'true'
        id: title
        run: |
          # shellcheck disable=SC2016  # `${...}` below are JS template literals, not shell.
          summary=$(node -e '
            const s = JSON.parse(require("fs").readFileSync("refresh-summary.json","utf8"));
            console.log(s.updates.map(u => `${u.name} ${u.to}`).join(", "));
          ')
          echo "title=chore(upstream): refresh ${summary}" >> "$GITHUB_OUTPUT"

      - name: Open / update PR
        if: steps.refresh.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ steps.title.outputs.title }}
          title: ${{ steps.title.outputs.title }}
          body-path: pr-body.md
          branch: chore/upstream-refresh
          delete-branch: true
          labels: |
            dependencies
            skip-changeset
          # Don't enable auto-merge — a refresh PR may surface real parity
          # breaks that require human review.
